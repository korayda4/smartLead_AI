<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afet Noktası — Yönetim Paneli</title>
    <meta name="description" content="Afet Noktası lead yönetim paneli.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --crimson:   #C0392B;
            --burgundy:  #7B1A1A;
            --burgundy2: #5a1212;
            --white:     #FFFFFF;
            --canvas:    #F7F7F7;
            --surface:   #FFFFFF;
            --border:    #E5E5E5;
            --text:      #1A1A1A;
            --muted:     #6B6B6B;
            --subtle:    #9A9A9A;
            --green:     #16a34a;
            --r:         8px;
            --rs:        4px;
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',-apple-system,sans-serif; background:var(--canvas); color:var(--text); min-height:100vh; display:flex; flex-direction:column; font-size:14px; }

        /* ── Header ── */
        header { height:56px; background:var(--burgundy); display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; box-shadow:0 2px 8px rgba(0,0,0,.25); }
        .brand { display:flex; align-items:center; gap:.5rem; text-decoration:none; color:var(--white); }
        .brand-name { font-size:1rem; font-weight:800; letter-spacing:-.2px; }
        .brand-pill { font-size:.65rem; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); color:rgba(255,255,255,.85); padding:.15rem .45rem; border-radius:3px; font-weight:600; }
        .nav-btns { display:flex; gap:.5rem; }
        .btn-nav { font-size:.775rem; font-weight:600; padding:.35rem .8rem; border-radius:var(--rs); text-decoration:none; transition:background .15s,border-color .15s; border:1px solid; cursor:pointer; }
        .btn-nav.ghost { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2); color:var(--white); }
        .btn-nav.ghost:hover { background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.5); }
        .btn-nav.danger { background:rgba(192,57,43,.25); border-color:rgba(192,57,43,.5); color:#fecaca; }
        .btn-nav.danger:hover { background:rgba(192,57,43,.45); border-color:#C0392B; }

        /* ── Layout ── */
        .container { max-width:1320px; margin:1.5rem auto; padding:0 1.25rem; flex:1; width:100%; }

        /* ── Stats ── */
        .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; margin-bottom:1.25rem; }
        .stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:1rem 1.25rem; display:flex; align-items:center; gap:.9rem; }
        .stat-icon { width:40px; height:40px; border-radius:var(--rs); display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
        .stat.total .stat-icon { background:#fef2f2; color:var(--crimson); }
        .stat.active .stat-icon { background:#fef2f2; color:var(--burgundy); }
        .stat.rate  .stat-icon { background:#f0fdf4; color:var(--green); }
        .stat-num { font-size:1.6rem; font-weight:800; line-height:1; color:var(--text); }
        .stat-lbl { font-size:.75rem; color:var(--muted); font-weight:500; margin-top:.2rem; }

        /* ── Data Card ── */
        .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
        .card-head { display:flex; align-items:center; justify-content:space-between; padding:.85rem 1.25rem; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:.75rem; background:var(--white); }
        .card-title { font-size:.875rem; font-weight:700; color:var(--text); }
        .card-actions { display:flex; align-items:center; gap:.6rem; }
        .search input { background:var(--canvas); border:1px solid var(--border); color:var(--text); padding:.4rem .75rem; border-radius:var(--rs); font-size:.8rem; font-family:inherit; outline:none; width:220px; transition:border-color .15s; }
        .search input:focus { border-color:var(--crimson); background:var(--white); }
        .btn-csv { background:var(--canvas); border:1px solid var(--border); color:var(--muted); padding:.4rem .8rem; border-radius:var(--rs); font-size:.775rem; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s; }
        .btn-csv:hover { border-color:var(--crimson); color:var(--crimson); }

        /* ── Table ── */
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:.825rem; }
        th { background:var(--canvas); color:var(--subtle); font-weight:700; padding:.6rem 1rem; border-bottom:1px solid var(--border); text-transform:uppercase; font-size:.7rem; letter-spacing:.4px; text-align:left; }
        th:first-child, td:first-child { padding-left:1.25rem; }
        td { padding:.8rem 1rem; border-bottom:1px solid var(--border); color:var(--text); vertical-align:middle; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:#fef9f9; }

        .badge { display:inline-block; padding:.18rem .55rem; border-radius:3px; font-size:.7rem; font-weight:700; }
        .badge-new  { background:#fef2f2; color:var(--crimson); border:1px solid rgba(192,57,43,.2); }
        .badge-rev  { background:#fdf4f4; color:var(--burgundy); border:1px solid rgba(123,26,26,.2); }
        .badge-done { background:#f0fdf4; color:var(--green);   border:1px solid rgba(22,163,74,.2); }

        .phone-link { color:var(--burgundy); text-decoration:none; font-weight:600; }
        .phone-link:hover { color:var(--crimson); text-decoration:underline; }

        .btn-detail { background:var(--canvas); border:1px solid var(--border); color:var(--muted); padding:.25rem .6rem; border-radius:var(--rs); font-size:.75rem; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; }
        .btn-detail:hover { border-color:var(--crimson); color:var(--crimson); background:var(--white); }

        .empty { text-align:center; padding:3rem 1rem; color:var(--subtle); font-size:.875rem; }

        /* ── Modal ── */
        .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:999; }
        .modal { background:var(--white); border-radius:var(--r); width:100%; max-width:460px; box-shadow:0 20px 40px rgba(0,0,0,.15); overflow:hidden; }
        .modal-hd { display:flex; align-items:center; justify-content:space-between; padding:.85rem 1.25rem; background:var(--burgundy); color:var(--white); }
        .modal-hd h3 { font-size:.875rem; font-weight:700; }
        .btn-close { background:none; border:none; color:rgba(255,255,255,.7); font-size:1.1rem; cursor:pointer; line-height:1; padding:0 .2rem; }
        .btn-close:hover { color:var(--white); }
        .modal-bd { padding:1.25rem; }
        .mf { margin-bottom:.85rem; }
        .mf label { display:block; font-size:.68rem; font-weight:700; color:var(--subtle); text-transform:uppercase; letter-spacing:.4px; margin-bottom:.25rem; }
        .mf div { font-weight:600; color:var(--text); font-size:.85rem; }
        .mf-note { background:var(--canvas); padding:.65rem .85rem; border-radius:var(--rs); font-weight:400 !important; line-height:1.5; color:var(--muted) !important; }
    </style>
</head>
<body>

<header>
    <a href="/dashboard" class="brand">
        <span class="brand-name">Afet Noktası</span>
        <span class="brand-pill">Yönetim Paneli</span>
    </a>
    <nav class="nav-btns">
        <a href="/anasayfa" class="btn-nav ghost">↗ Ana Sayfaya Dön</a>
        <a href="/logout" class="btn-nav danger">Çıkış Yap</a>
    </nav>
</header>

<div class="container">

    <div class="stats">
        <div class="stat total">
            <div class="stat-icon">📋</div>
            <div><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Toplam Lead</div></div>
        </div>
        <div class="stat active">
            <div class="stat-icon">🔴</div>
            <div><div class="stat-num" id="statActive">0</div><div class="stat-lbl">Aktif Lead</div></div>
        </div>
        <div class="stat rate">
            <div class="stat-icon">✅</div>
            <div><div class="stat-num">%100</div><div class="stat-lbl">AI Yanıt Oranı</div></div>
        </div>
    </div>

    <div class="card">
        <div class="card-head">
            <span class="card-title">Müşteri İletişim Talepleri</span>
            <div class="card-actions">
                <div class="search"><input id="searchInput" type="text" placeholder="İsim veya telefon ara…" onkeyup="filtrele()"></div>
                <button class="btn-csv" onclick="csvIndir()">CSV İndir</button>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Müşteri Adı</th>
                        <th>Telefon</th>
                        <th>Not / Mesaj</th>
                        <th>Durum</th>
                        <th>Tarih</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="leadTableBody"></tbody>
            </table>
        </div>
        <div id="emptyState" class="empty" style="display:none;">Henüz kayıtlı iletişim talebi bulunmuyor.</div>
    </div>

</div>

<div class="modal-bg" id="detailModal">
    <div class="modal">
        <div class="modal-hd">
            <h3>Kayıt Detayı</h3>
            <button class="btn-close" onclick="modalKapat()">✕</button>
        </div>
        <div class="modal-bd" id="modalBody"></div>
    </div>
</div>

<script>
    let tumKayitlar = [];

    async function leadleriYukle() {
        try {
            const res = await fetch('/api/leads');
            const data = await res.json();
            if (data.ok) {
                tumKayitlar = data.data;
                istatistik(tumKayitlar);
                tabloCiz(tumKayitlar);
            }
        } catch (e) { console.error(e); }
    }

    function istatistik(rows) {
        document.getElementById('statTotal').textContent = rows.length;
        document.getElementById('statActive').textContent = rows.filter(r => (r.status || 'Yeni').toLowerCase() === 'yeni').length;
    }

    function badge(status) {
        const s = (status || 'Yeni').toLowerCase();
        if (s === 'incelendi') return `<span class="badge badge-rev">İncelendi</span>`;
        if (s === 'ulaşıldı' || s === 'ulasildi') return `<span class="badge badge-done">Ulaşıldı</span>`;
        return `<span class="badge badge-new">Yeni</span>`;
    }

    function tabloCiz(rows) {
        const tbody = document.getElementById('leadTableBody');
        const empty = document.getElementById('emptyState');
        tbody.innerHTML = '';
        if (!rows || !rows.length) { empty.style.display = 'block'; return; }
        empty.style.display = 'none';
        rows.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:700">${esc(item.isim)}</td>
                <td><a href="tel:${esc(item.telefon)}" class="phone-link">${esc(item.telefon)}</a></td>
                <td style="max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)">${esc(item.mesaj||'-')}</td>
                <td>${badge(item.status)}</td>
                <td style="color:var(--subtle);font-size:.75rem">${tarih(item.created_at)}</td>
                <td><button class="btn-detail" onclick="detay(${item.id})">İncele</button></td>`;
            tbody.appendChild(tr);
        });
    }

    function filtrele() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        tabloCiz(q ? tumKayitlar.filter(r => r.isim.toLowerCase().includes(q) || r.telefon.toLowerCase().includes(q) || (r.mesaj && r.mesaj.toLowerCase().includes(q))) : tumKayitlar);
    }

    function detay(id) {
        const lead = tumKayitlar.find(r => r.id === id);
        if (!lead) return;
        document.getElementById('modalBody').innerHTML = `
            <div class="mf"><label>Müşteri Adı</label><div>${esc(lead.isim)}</div></div>
            <div class="mf"><label>Telefon</label><div><a href="tel:${esc(lead.telefon)}" class="phone-link">${esc(lead.telefon)}</a></div></div>
            <div class="mf"><label>Kayıt Tarihi</label><div>${tarih(lead.created_at)}</div></div>
            <div class="mf"><label>Durum</label><div>${badge(lead.status)}</div></div>
            <div class="mf"><label>Not / Mesaj</label><div class="mf-note">${esc(lead.mesaj||'Belirtilmemiş.')}</div></div>`;
        document.getElementById('detailModal').style.display = 'flex';
    }

    function modalKapat() { document.getElementById('detailModal').style.display = 'none'; }

    function esc(t) {
        if (!t) return '';
        return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function tarih(s) {
        if (!s) return '-';
        try { const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
        catch { return s; }
    }

    function csvIndir() {
        if (!tumKayitlar.length) { alert('İndirilecek kayıt yok.'); return; }
        let csv = "data:text/csv;charset=utf-8,\uFEFFIsim,Telefon,Mesaj,Durum,Tarih\n";
        tumKayitlar.forEach(r => {
            csv += [`"${(r.isim||'').replace(/"/g,'""')}"`,`"${(r.telefon||'').replace(/"/g,'""')}"`,`"${(r.mesaj||'').replace(/"/g,'""')}"`,`"${r.status||'Yeni'}"`,`"${r.created_at||''}"`].join(',') + '\n';
        });
        const a = document.createElement('a');
        a.href = encodeURI(csv);
        a.download = `leads_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    window.addEventListener('DOMContentLoaded', leadleriYukle);
    document.getElementById('detailModal').addEventListener('click', e => { if (e.target === e.currentTarget) modalKapat(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afet Noktası - Yönetici Girişi</title>
    <meta name="description" content="Afet Noktası Yönetim Paneli Kullanıcı Giriş Ekranı.">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-navy: #1B2A4A;
            --brand-navy-light: #2c3e66;
            --brand-orange: #F26419;
            --brand-orange-hover: #d9530f;
            --brand-orange-light: #fff7ed;
            --bg-canvas: #f8fafc;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-clean: #e2e8f0;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-clean);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(27, 42, 74, 0.08);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--brand-navy);
            letter-spacing: -0.4px;
        }

        .brand-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            background-color: var(--brand-orange);
            border-radius: 50%;
        }

        .brand-subtitle {
            font-size: 0.825rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.775rem;
            font-weight: 700;
            color: var(--brand-navy);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-canvas);
            border: 1.5px solid var(--border-clean);
            color: var(--text-main);
            padding: 0.75rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: var(--brand-navy);
        }

        .btn-login {
            width: 100%;
            background: var(--brand-orange);
            color: #ffffff;
            border: none;
            padding: 0.85rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: var(--brand-orange-hover);
        }

        .error-alert {
            background: var(--brand-orange-light);
            border: 1px solid rgba(242, 100, 25, 0.3);
            color: var(--brand-orange);
            padding: 0.75rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.825rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-brand">
            <div class="brand-title">
                Afet Noktası<span class="brand-dot"></span>
            </div>
            <div class="brand-subtitle">Yönetici Paneli Girişi</div>
        </div>

        {% if hata %}
        <div class="error-alert">
            {{ hata }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">E-posta Adresi</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="koray@afetnoktasi.com" required value="koray@afetnoktasi.com">
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Giriş Yap</button>
        </form>
    </div>

</body>
</html>
